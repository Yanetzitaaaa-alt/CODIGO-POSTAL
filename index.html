<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código Postal</title>

    <style>
        body {
             font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe0f7, #e0ffe4, #f0e0ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0px 4px 15px rgba(128, 0, 128, 0.2);
            border: 2px solid #d8b4fe;
        }

        h1, h2 {
            text-align: center;
            color: #7e22ce;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #059669;
            font-weight: bold;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        input {
            border: 2px solid #f9a8d4;
        }

        input:focus {
            outline: none;
            border-color: #c084fc;
            box-shadow: 0 0 5px rgba(192, 132, 252, 0.5);
        }

        small {
            color: #a855f7;
        }

        button {
            background: linear-gradient(90deg, #ec4899, #22c55e);
            color: white;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            background: linear-gradient(90deg, #db2777, #16a34a);
            transform: scale(1.02);
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #bbf7d0;
            border-radius: 10px;
            background: #fef7ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table, th, td {
            border: 1px solid #fbcfe8;
        }

        th, td {
            padding: 8px;
            text-align: center;
        }

        th {
            background: linear-gradient(90deg, #a855f7, #ec4899);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f0fdf4;
        }

        tr:nth-child(odd) {
            background-color: #fdf4ff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Formulario Código Postal</h1>
        
        <form id="formCP">
            <label for="cp">Código Postal:</label>
            <input 
                type="text"
                id="cp"
                name="cp"
                pattern="[0-9]{5}"
                placeholder="Ejemplo: 12345"
                required
            >
            <small>Debe contener exactamente 5 números.</small>
            <button type="submit">Guardar</button>
        </form>

        <!-- RESULTADO -->
        <div class="resultado">
            <h2>Registros Guardados</h2>
            <ul id="listaCP"></ul>
            <button class="borrar" id="btnBorrar">Borrar todos</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('formCP');
        const inputCP = document.getElementById('cp');
        const listaCP = document.getElementById('listaCP');
        const btnBorrar = document.getElementById('btnBorrar');

        // Cargar registros al abrir la página
        document.addEventListener('DOMContentLoaded', mostrarRegistros);

        // Guardar al enviar form
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const cp = inputCP.value;
            
            // Validar con pattern por si el navegador no lo hace
            if (!/^[0-9]{5}$/.test(cp)) {
                alert('El código postal debe tener exactamente 5 números');
                return;
            }

            // Obtener registros existentes
            let registros = JSON.parse(localStorage.getItem('codigosPostales')) || [];
            
            // Agregar nuevo con fecha
            registros.push({
                codigo: cp,
                fecha: new Date().toLocaleString('es-MX')
            });
            
            // Guardar en localStorage
            localStorage.setItem('codigosPostales', JSON.stringify(registros));
            
            // Limpiar input y actualizar lista
            inputCP.value = '';
            mostrarRegistros();
        });

        // Función para mostrar todos los registros
        function mostrarRegistros() {
            const registros = JSON.parse(localStorage.getItem('codigosPostales')) || [];
            listaCP.innerHTML = '';
            
            if (registros.length === 0) {
                listaCP.innerHTML = '<li>No hay registros aún</li>';
                return;
            }
            
            registros.reverse().forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${item.codigo}</strong> - <small>${item.fecha}</small>`;
                listaCP.appendChild(li);
            });
        }

        // Borrar todos los registros
        btnBorrar.addEventListener('click', function() {
            if (confirm('¿Seguro que quieres borrar todos los registros?')) {
                localStorage.removeItem('codigosPostales');
                mostrarRegistros();
            }
        });
    </script>
</body>
</html>
